worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # ─── Keycloak — OAuth-редиректы, JWKS ───────────────────────
        # Браузер ходит на /auth/..., nginx проксирует в keycloak:8180/auth/...
        location /auth/ {
            proxy_pass         http://keycloak:8180/auth/;
            proxy_buffer_size  128k;
            proxy_buffers      4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /api/ {
            proxy_pass         http://app:8080/api/;
            proxy_read_timeout 120s;
        }

        location /swagger {
            proxy_pass http://app:8080/swagger;
        }
        location /swagger-ui/ {
            proxy_pass http://app:8080/swagger-ui/;
        }
        location /v3/api-docs {
            proxy_pass http://app:8080/v3/api-docs;
        }

        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}